<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signal · Live shot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFD23F}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif">
  <sc-if value="{{cue}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 77.2%; background: {{t.fill}}"></div>
  </sc-if>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 20px 22px 30px; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: {{t.sub}}">
      <span style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{t.rec}}"></span>Rec</span>
      <span>Scale 82%</span>
    </div>

    <div style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center">
      <span style="font-size: 250px; font-weight: 800; line-height: 0.8; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">8.2</span>
      <span style="margin-top: 10px; font-size: 40px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">g to go</span>
    </div>

    <div style="display: flex; align-items: flex-end; gap: 14px">
      <span style="font-size: 132px; font-weight: 800; line-height: 0.8; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">1.4</span>
      <span style="display: flex; flex-direction: column; padding-bottom: 2px">
        <span style="font-size: 34px; font-weight: 700; line-height: 1; text-transform: uppercase">g/s</span>
        <span style="font-size: 20px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: {{t.sub2}}">Flow</span>
      </span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lightMode":{"editor":"boolean","default":false},"screenFill":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const light = this.props.lightMode ?? false;
    const cue = this.props.screenFill ?? true;
    const t = light
      ? { bg: '#FFFFFF', ink: '#000000', sub: '#555555', sub2: cue ? '#000000' : '#555555', fill: '#4D7BFF', rec: '#E5484D' }
      : { bg: '#000000', ink: '#FFFFFF', sub: '#A3A3A3', sub2: cue ? '#DCE4FF' : '#A3A3A3', fill: '#2F5BFF', rec: '#FF5A5F' };
    return { t, cue };
  }
}
</script>
</body>
</html>
