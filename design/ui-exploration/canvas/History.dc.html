<div class="ss {{theme}}" style="width: 390px; height: 844px">
  <div style="height: 100%; padding: 16px 16px 96px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px">
      <h1 class="ttl">History</h1>
      <button type="button" class="btn2" onClick="{{toggle}}" style="font-family: var(--btn-font); font-size: 13px; font-weight: var(--btn-weight)">{{toggleLabel}}</button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
      <h2 class="lbl" style="margin: 0">Last 7 days</h2>
      <span class="muted" style="font-size: 13px"><span class="num">7</span> shots</span>
    </div>

    <div class="card" style="overflow: hidden">
      <sc-if value="{{browsing}}" hint-placeholder-val="{{true}}">
        <div>
          <sc-for list="{{shots}}" as="r" hint-placeholder-count="7">
            <a class="row" href="History-Detail.dc.html" style="display: grid; grid-template-columns: 64px minmax(0, 1fr) 84px 10px; column-gap: 12px; min-height: 60px; padding: 10px 14px">
              <svg viewBox="0 0 1000 500" preserveAspectRatio="none" style="display: block; width: 64px; height: 32px" aria-hidden="true">
                <path d="M0 499H1000" style="fill: none; stroke: var(--rule); stroke-width: 1; vector-effect: non-scaling-stroke"></path>
                <path d="{{r.target}}" style="fill: none; stroke: var(--tick); stroke-width: 1; stroke-dasharray: 2 2; vector-effect: non-scaling-stroke"></path>
                <path d="{{r.spark}}" style="fill: none; stroke: var(--line-a); stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke"></path>
              </svg>
              <span style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-weight: 600; white-space: nowrap">{{r.day}}</span>
                <span class="muted" style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span class="num">{{r.time}}</span> · {{r.drink}}</span>
              </span>
              <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px">
                <span class="{{r.tasteCls}}" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; white-space: nowrap"><span class="dot {{r.dotCls}}" style="width: 8px; height: 8px"></span>{{r.taste}}</span>
                <sc-if value="{{r.channelled}}" hint-placeholder-val="{{false}}"><span class="badge caution" style="height: 18px; padding: 0 6px; font-size: 10px">Channelled</span></sc-if>
              </span>
              <span class="chev" aria-hidden="true">›</span>
            </a>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{picking}}" hint-placeholder-val="{{false}}">
        <div>
          <sc-for list="{{shots}}" as="r" hint-placeholder-count="7">
            <button type="button" class="row" onClick="{{r.pick}}" aria-pressed="{{r.on}}" style="display: grid; grid-template-columns: 26px 64px minmax(0, 1fr) 84px; column-gap: 12px; width: 100%; min-height: 60px; padding: 10px 14px; background: transparent; border-left: 0; border-right: 0; border-bottom: 0; font-family: var(--font-text); font-size: 15px; text-align: left">
              <span style="display: flex; width: 26px; height: 26px">
                <sc-if value="{{r.isA}}" hint-placeholder-val="{{false}}"><span style="display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: var(--line-a); color: var(--bg); font-family: var(--font-num); font-size: 13px; font-weight: 700">A</span></sc-if>
                <sc-if value="{{r.isB}}" hint-placeholder-val="{{false}}"><span style="display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: var(--line-b); color: var(--bg); font-family: var(--font-num); font-size: 13px; font-weight: 700">B</span></sc-if>
                <sc-if value="{{r.isFree}}" hint-placeholder-val="{{true}}"><span style="display: block; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--tick)"></span></sc-if>

              <svg viewBox="0 0 1000 500" preserveAspectRatio="none" style="display: block; width: 64px; height: 32px" aria-hidden="true">
                <path d="M0 499H1000" style="fill: none; stroke: var(--rule); stroke-width: 1; vector-effect: non-scaling-stroke"></path>
                <path d="{{r.target}}" style="fill: none; stroke: var(--tick); stroke-width: 1; stroke-dasharray: 2 2; vector-effect: non-scaling-stroke"></path>
                <path d="{{r.spark}}" style="fill: none; stroke: var(--line-a); stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke"></path>
              </svg>
              <span style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-weight: 600; white-space: nowrap">{{r.day}}</span>
                <span class="muted" style="font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span class="num">{{r.time}}</span> · {{r.drink}}</span>
              </span>
              <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px">

              </span>
            </button>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </div>

      <sc-if value="{{ready}}" hint-placeholder-val="{{false}}">
        <a class="btn" href="History-Compare.dc.html">Compare 2 shots<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
      </sc-if>
      <sc-if value="{{waiting}}" hint-placeholder-val="{{true}}">
        <div role="status" style="display: flex; align-items: center; justify-content: center; height: 56px; border: 1px dashed var(--tick); border-radius: var(--btn-r); color: var(--sub); font-family: var(--btn-font); font-size: var(--btn-size); font-weight: var(--btn-weight); letter-spacing: var(--btn-track); text-transform: var(--btn-case)">Pick two shots</div>
      </sc-if>
    </div>
  </sc-if>

  <nav class="tabbar" aria-label="Main">
    <a class="tab" href="Main.dc.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>Home</a>
    <a class="tab" href="Brew-Beans.dc.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"></path><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"></path><path d="M8 3v2M12 3v2"></path></svg>Brew</a>
    <a class="tab on" href="History.dc.html" aria-current="page"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>History</a>

  </nav>
</div>

        tasteCls: TASTE[taste].cls,
        dotCls: TASTE[taste].dot,
        on: at !== -1,
        isA: at === 0,
        isB: at === 1,
        isFree: at === -1,
        pick: () => {
          // Tap a picked row to drop it (the other becomes A); a third pick replaces B.
          const next = picks.filter((p) => p !== i);
          if (next.length === picks.length) {
            if (next.length === 2) next[1] = i;
            else next.push(i);
          }
          this.setState({ ...s, seed: seeded, picking: true, picks: next });
        },
      };
    });

    return {
      theme: 'look-' + look + ' mode-' + (dark ? 'dark' : 'light'),
      shots,
      picking,
      browsing: !picking,
      toggleLabel: picking ? 'Cancel' : 'Compare',
      ready: picks.length === 2,
      waiting: picks.length < 2,
      toggle: () => this.setState({ ...s, seed: seeded, picking: !picking, picks: [] }),
    };
  }
}
</script>
</body>
</html>
