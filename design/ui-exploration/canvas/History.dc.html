<div class="ss {{theme}}" style="width: 390px; height: 844px">
  <div style="height: 100%; padding: 16px 16px 96px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px">
      <h1 class="ttl">History</h1>
      <sc-if value="{{browsing}}" hint-placeholder-val="{{true}}">
        <button type="button" class="btn2" onClick="{{toggle}}" style="font-family: var(--btn-font); font-size: 13px; font-weight: var(--btn-weight)">Compare</button>
      </sc-if>
      <sc-if value="{{picking}}" hint-placeholder-val="{{false}}">
        <button type="button" class="btn2" onClick="{{toggle}}" style="font-family: var(--btn-font); font-size: 13px; font-weight: var(--btn-weight)">Cancel</button>
      </sc-if>
    </div>

    <div style="display: flex; align-items: center; gap: 8px">
      <button type="button" class="chip" style="font-size: 13px; font-weight: 600">All coffees<svg class="ico" viewBox="0 0 24 24" style="width: 14px; height: 14px" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
      <button type="button" class="chip" style="font-size: 13px; font-weight: 600">7 days<svg class="ico" viewBox="0 0 24 24" style="width: 14px; height: 14px" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
      <span class="muted" style="margin-left: auto; font-size: 13px"><span class="num">7</span> shots</span>
    </div>

    <div class="card" style="overflow: hidden">
      <sc-if value="{{browsing}}" hint-placeholder-val="{{true}}">
        <div>
          <sc-for list="{{shots}}" as="r" hint-placeholder-count="7">
            <a class="row" href="History-Detail.dc.html" style="flex-direction: column; align-items: stretch; justify-content: center; gap: 3px; padding: 10px 14px">
              <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
                <span style="display: flex; align-items: baseline; gap: 8px; white-space: nowrap"><span style="font-weight: 600">{{r.day}}</span><span class="num muted" style="font-size: 13px; font-weight: 500">{{r.time}}</span></span>
                <span style="display: flex; align-items: center; gap: 10px; font-size: 13px; white-space: nowrap">
                  <span style="display: inline-flex; align-items: center; gap: 6px"><span class="dot {{r.dirCls}}" style="width: 8px; height: 8px"></span>{{r.dir}}</span>
                  <span style="min-width: 38px; text-align: right"><span class="num" style="font-size: 15px">{{r.score}}</span><span class="unit" style="font-size: 12px">/10</span></span>
                  <span class="{{r.vsCls}}" role="img" aria-label="{{r.vsLabel}}" style="width: 12px; text-align: center; font-weight: 700">{{r.vsMark}}</span>
                </span>
              </span>

              <span style="display: flex; align-items: center; gap: 6px; margin-top: 2px; white-space: nowrap; overflow: hidden">
                <sc-for list="{{r.tags}}" as="t" hint-placeholder-count="2"><span class="badge">{{t.name}}</span></sc-for>
                <sc-if value="{{r.hasMilk}}" hint-placeholder-val="{{true}}"><span class="muted" style="display: inline-flex; align-items: center; gap: 4px; margin-left: 4px; font-size: 12px"><svg class="ico" viewBox="0 0 24 24" style="width: 14px; height: 14px" aria-hidden="true"><path d="M8 3h8v3l2 3v12H6V9l2-3z"></path><path d="M6 9h12"></path></svg>{{r.milk}}</span></sc-if>
              </span>
            </a>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{picking}}" hint-placeholder-val="{{false}}">
        <div>
          <sc-for list="{{shots}}" as="r" hint-placeholder-count="7">

              <span style="flex: 0 0 auto; display: flex; width: 26px; height: 26px">
                <sc-if value="{{r.isA}}" hint-placeholder-val="{{false}}"><span style="display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: var(--line-a); color: var(--bg); font-family: var(--font-num); font-size: 13px; font-weight: 700">A</span></sc-if>
                <sc-if value="{{r.isB}}" hint-placeholder-val="{{false}}"><span style="display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: var(--line-b); color: var(--bg); font-family: var(--font-num); font-size: 13px; font-weight: 700">B</span></sc-if>

                  <span style="display: flex; align-items: baseline; gap: 8px; white-space: nowrap"><span style="font-weight: 600">{{r.day}}</span><span class="num muted" style="font-size: 13px; font-weight: 500">{{r.time}}</span></span>
                  <span style="display: flex; align-items: center; gap: 10px; font-size: 13px; white-space: nowrap">
                    <span style="display: inline-flex; align-items: center; gap: 6px"><span class="dot {{r.dirCls}}" style="width: 8px; height: 8px"></span>{{r.dir}}</span>
                    <span style="min-width: 38px; text-align: right"><span class="num" style="font-size: 15px">{{r.score}}</span><span class="unit" style="font-size: 12px">/10</span></span>
                    <span class="{{r.vsCls}}" role="img" aria-label="{{r.vsLabel}}" style="width: 12px; text-align: center; font-weight: 700">{{r.vsMark}}</span>
                  </span>
                </span>
                <span class="muted" style="font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.lead}}<span class="{{r.readCls}}" style="margin-left: 4px; font-size: 12px; font-weight: 600">{{r.reading}}</span>{{r.tail}}</span>
                <span style="display: flex; align-items: center; gap: 6px; margin-top: 2px; white-space: nowrap; overflow: hidden">
                  <sc-for list="{{r.tags}}" as="t" hint-placeholder-count="2"><span class="badge">{{t.name}}</span></sc-for>
                  <sc-if value="{{r.hasMilk}}" hint-placeholder-val="{{true}}"><span class="muted" style="display: inline-flex; align-items: center; gap: 4px; margin-left: 4px; font-size: 12px"><svg class="ico" viewBox="0 0 24 24" style="width: 14px; height: 14px" aria-hidden="true"><path d="M8 3h8v3l2 3v12H6V9l2-3z"></path><path d="M6 9h12"></path></svg>{{r.milk}}</span></sc-if>
                </span>
              </span>
            </button>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </div>

  <sc-if value="{{picking}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 0; right: 0; bottom: 80px; padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--rule)">
      <sc-if value="{{ready}}" hint-placeholder-val="{{false}}">
        <a class="btn" href="History-Compare.dc.html">Compare 2 shots<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
      </sc-if>
      <sc-if value="{{waiting}}" hint-placeholder-val="{{true}}">
        <div role="status" style="display: flex; align-items: center; justify-content: center; height: 56px; border: 1px dashed var(--tick); border-radius: var(--btn-r); color: var(--sub); font-family: var(--btn-font); font-size: var(--btn-size); font-weight: var(--btn-weight); letter-spacing: var(--btn-track); text-transform: var(--btn-case)">Pick two shots</div>
      </sc-if>
    </div>
  </sc-if>

  <nav class="tabbar" aria-label="Main">
    <a class="tab" href="Main.dc.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>Home</a>
    <a class="tab" href="Brew-Beans.dc.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"></path><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"></path><path d="M8 3v2M12 3v2"></path></svg>Brew</a>
    <a class="tab on" href="History.dc.html" aria-current="page"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>History</a>
    <a class="tab" href="Setup.dc.html"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>Setup</a>
  </nav>
</div>

      ['Wed 30 Sep', '07:15', 'Balanced', '7', 'better', 'Guji · ORO 6.2 · 7.1 s', 'ontime', ' · 34.0 g · 1:2.00', ['WDT', 'Puck screen'], ''],
      ['Tue 29 Sep', '07:02', 'Balanced', '6', 'same', 'Guji · ORO 6.3 · 6.8 s', 'ontime', ' · 34.6 g · 1:2.04', ['WDT'], ''],
      ['Mon 28 Sep', '07:10', 'Sour', '5', 'none', 'Guji · C40 22 clicks · 5.9 s', 'fast', ' · 35.1 g · 1:2.07', ['WDT', 'Experiment'], ''],
    ];

    const shots = data.map(([day, time, dir, score, vs, lead, read, tail, tags, milk], i) => {
      const at = picks.indexOf(i);
      return {
        day,
        time,
        dir,
        score,
        lead,
        tail,
        reading: READ[read].word,
        readCls: READ[read].cls,
        milk,
        dirCls: DIR[dir],
        vsMark: VS[vs].mark,
        vsCls: VS[vs].cls,
        vsLabel: VS[vs].label,
        tags: tags.map((name) => ({ name })),
        hasMilk: milk !== '',
        on: at !== -1,
        isA: at === 0,
        isB: at === 1,
        isFree: at === -1,
        pick: () => {
          // Tap a picked row to drop it (the other becomes A); a third pick replaces B.
          const next = picks.filter((p) => p !== i);
          if (next.length === picks.length) {
            if (next.length === 2) next[1] = i;
            else next.push(i);
          }
          this.setState({ seed: seeded, picking: true, picks: next });
        },
      };
    });

    return {
      theme: 'look-' + look + ' mode-' + (dark ? 'dark' : 'light'),
      shots,
      picking,
      browsing: !picking,
      ready: picks.length === 2,
      waiting: picks.length < 2,
      toggle: () => this.setState({ seed: seeded, picking: !picking, picks: [] }),
    };
  }
}
</script>
