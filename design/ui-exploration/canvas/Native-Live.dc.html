<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Native · Live shot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0068DA}a:hover{color:#004FA8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 18px 16px 34px; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.ink}}; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif">
  <div style="display: flex; justify-content: center">
    <span style="display: flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: {{t.card}}; font-size: 13px; font-weight: 600; color: {{t.sub}}">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: {{t.red}}"></span>Recording · BOOKOO 82%
    </span>
  </div>

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center">
    <span style="font-size: 156px; font-weight: 700; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums">8.2</span>
    <span style="margin-top: 4px; font-size: 26px; font-weight: 600; color: {{t.sub}}">g to go</span>
    <sc-if value="{{cue}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 26px">
        <div style="position: relative; width: 240px; height: 6px; border-radius: 3px; background: {{t.track}}" role="progressbar" aria-valuemin="0" aria-valuemax="36" aria-valuenow="27.8" aria-label="Yield so far">
          <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 77.2%; border-radius: 3px; background: {{t.tint}}"></div>
        </div>
        <span style="font-size: 13px; font-weight: 500; color: {{t.sub}}">27.8 of 36.0 g</span>
      </div>
    </sc-if>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-radius: 20px; background: {{t.card}}">
    <span style="font-size: 17px; font-weight: 600; color: {{t.sub}}">Flow</span>
    <span style="display: flex; align-items: baseline; gap: 6px">
      <span style="font-size: 54px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">1.4</span>
      <span style="font-size: 20px; font-weight: 600; color: {{t.sub}}">g/s</span>
    </span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"darkMode":{"editor":"boolean","default":false},"progressBar":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.darkMode ?? false;
    const t = dark
      ? { bg: '#000000', card: '#1C1C1E', ink: '#FFFFFF', sub: '#A1A1A6', track: '#2C2C2E', tint: '#3D9BFF', red: '#FF453A' }
      : { bg: '#F2F2F7', card: '#FFFFFF', ink: '#000000', sub: '#6C6C70', track: '#E3E3E8', tint: '#0068DA', red: '#FF3B30' };
    return { t, cue: this.props.progressBar ?? false };
  }
}
</script>
</body>
</html>
